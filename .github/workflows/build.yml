name: PlatformIO Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/m5stack_paper/firmware.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Rename firmware with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cp .pio/build/m5stack_paper/firmware.bin "M5Paper-S3-Chinese-Books-${VERSION}.bin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: M5Paper-S3-Chinese-Books-*.bin
          generate_release_notes: true
